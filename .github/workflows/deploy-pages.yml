name: Deploy ORBIT Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Test Suite (19 Scenarios)
        run: |
          pytest tests/ -v

      - name: Prepare GitHub Pages Distribution (_site)
        run: |
          mkdir -p _site
          # Copy Web Studio HTML, styles, and scripts
          cp index.html _site/
          cp -r static _site/
          cp -r css _site/
          cp -r js _site/
          # Copy visual assets and documentation
          cp -r assets _site/
          cp -r data _site/
          cp -r docs _site/
          cp README.md _site/
          cp LICENSE _site/
          cp image.png _site/
          # Disable Jekyll processing
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
