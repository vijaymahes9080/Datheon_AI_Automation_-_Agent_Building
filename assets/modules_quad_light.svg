<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <linearGradient id="quadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
  </defs>

  <rect width="1200" height="580" fill="url(#quadBg)" />
  <rect width="1200" height="580" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect width="175" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE" />
    <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#4338CA">FOUR INTERNSHIP SYSTEMS</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#0F172A">Enterprise Operational Pipelines</text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#64748B">Deterministic safety, grounded context, and verifiable audit trails across each business unit</text>
  </g>

  <!-- Bento Grid 2x2 -->
  <g transform="translate(60, 140)">
    
    <!-- Quadrant 1: Lead Intelligence -->
    <g transform="translate(0, 0)" filter="url(#tileShadow)">
      <rect width="525" height="195" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="0" y="0" width="6" height="195" rx="3" fill="#4F46E5" />
      
      <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. Lead Intelligence &amp; Revenue Routing</text>
      <text x="24" y="50" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748B">Web forms, webhooks, heuristic scoring, AI talking points, and CRM routing</text>

      <!-- Pipeline Step Chips -->
      <g transform="translate(24, 66)">
        <rect x="0" y="0" width="477" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="10" y="21" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#4338CA">Capture → Validate → Normalize → Qualify → Persist → Route → Notify → Audit</text>
      </g>

      <!-- Metrics and features -->
      <g transform="translate(24, 115)">
        <rect x="0" y="0" width="150" height="65" rx="8" fill="#EEF2FF" />
        <text x="14" y="22" font-family="sans-serif" font-size="10" font-weight="600" fill="#4338CA">QUALIFICATION SCORE</text>
        <text x="14" y="44" font-family="sans-serif" font-size="18" font-weight="800" fill="#1E1B4B">85 / 100</text>
        <text x="14" y="58" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#059669">High Priority Badge</text>

        <rect x="162" y="0" width="315" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">• SLA Verification: &lt; 10s target (42ms measured)</text>
        <text x="14" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Idempotent Airtable record sync with rollback</text>
        <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Rich Slack Block Kit notification dispatch</text>
      </g>
    </g>

    <!-- Quadrant 2: Support Intelligence -->
    <g transform="translate(555, 0)" filter="url(#tileShadow)">
      <rect width="525" height="195" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="0" y="0" width="6" height="195" rx="3" fill="#2563EB" />
      
      <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. Customer Support &amp; Email Intelligence</text>
      <text x="24" y="50" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748B">8 intent classes, grounded RAG policies, draft-only shield, and escalation</text>

      <!-- Pipeline Step Chips -->
      <g transform="translate(24, 66)">
        <rect x="0" y="0" width="477" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="12" y="21" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8">Receive → Classify → Assess → Retrieve → Draft → Review → Label → Audit</text>
      </g>

      <g transform="translate(24, 115)">
        <rect x="0" y="0" width="150" height="65" rx="8" fill="#FEF3C7" />
        <text x="14" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#92400E">DRAFT-ONLY SAFETY</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="800" fill="#78350F">ENFORCED</text>
        <text x="14" y="58" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#B45309">No Auto Sending</text>

        <rect x="162" y="0" width="315" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">• Zero-hallucination grounded knowledge RAG</text>
        <text x="14" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Delimiter override &amp; prompt injection filters</text>
        <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Mandatory escalation: refunds, outages, legal</text>
      </g>
    </g>

    <!-- Quadrant 3: Invoice Intelligence -->
    <g transform="translate(0, 215)" filter="url(#tileShadow)">
      <rect width="525" height="195" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="0" y="0" width="6" height="195" rx="3" fill="#059669" />
      
      <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. Invoice Intelligence &amp; Financial Operations</text>
      <text x="24" y="50" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748B">PDF text &amp; line item extraction, arithmetic audit, deduplication, Sheets export</text>

      <g transform="translate(24, 66)">
        <rect x="0" y="0" width="477" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="14" y="21" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#047857">Upload → Inspect → Extract → Validate → Reconcile → Approve → Export → Audit</text>
      </g>

      <g transform="translate(24, 115)">
        <rect x="0" y="0" width="150" height="65" rx="8" fill="#ECFDF5" />
        <text x="14" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#065F46">AUDIT TOLERANCE</text>
        <text x="14" y="44" font-family="sans-serif" font-size="16" font-weight="800" fill="#047857">&plusmn; $0.05</text>
        <text x="14" y="58" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#059669">Strict Math Check</text>

        <rect x="162" y="0" width="315" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">• Subtotal - Discount + Tax == Total audit</text>
        <text x="14" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• SHA-256 fingerprint catches duplicate bills</text>
        <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Human sign-off required prior to Sheets export</text>
      </g>
    </g>

    <!-- Quadrant 4: Enterprise Orchestration -->
    <g transform="translate(555, 215)" filter="url(#tileShadow)">
      <rect width="525" height="195" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="0" y="0" width="6" height="195" rx="3" fill="#7C3AED" />
      
      <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0F172A">4. Enterprise Multi-Agent Orchestration</text>
      <text x="24" y="50" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748B">Client intake, contract drafting, Stripe HMAC webhook, Slack and digests</text>

      <g transform="translate(24, 66)">
        <rect x="0" y="0" width="477" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="8" y="21" font-family="sans-serif" font-size="10" font-weight="600" fill="#6D28D9">Intake → Contract Draft → Approval → Stripe HMAC → Slack Provision → Digest</text>
      </g>

      <g transform="translate(24, 115)">
        <rect x="0" y="0" width="150" height="65" rx="8" fill="#FAF5FF" />
        <text x="14" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#6B21A8">SECURITY CHECK</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="800" fill="#581C87">HMAC-SHA256</text>
        <text x="14" y="58" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#7E22CE">Replay Protected</text>

        <rect x="162" y="0" width="315" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">• Sequential project code allocator (PRJ-...)</text>
        <text x="14" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Template-governed Master Services Agreement</text>
        <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="500" fill="#475569">• Automated Slack project channel provisioning</text>
      </g>
    </g>

  </g>
</svg>
