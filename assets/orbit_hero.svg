      <text x="130" y="97" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748B">TEST SUITE</text>
      <text x="130" y="114" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981">19/19 Pass</text>

      <text x="18" y="145" font-family="sans-serif" font-size="11" font-weight="500" fill="#334155">• Stable Project ID Allocator</text>
      <text x="18" y="165" font-family="sans-serif" font-size="11" font-weight="500" fill="#334155">• Template-Governed MSA</text>
      <text x="18" y="185" font-family="sans-serif" font-size="11" font-weight="500" fill="#334155">• Slack Channel Provisioning</text>
      
